<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene Token Idle</title>
    <link rel=stylesheet type="text/css" href="style.css">
</head>

<body style="background-color: #d0c530;">
    <div style="display:flex; background-color:greenyellow;">
        <img src="eugene_token.png" height="82px" style="margin-bottom: 10px; margin-top: 10px; margin-left: 10px"> 
        <h1 id="eugene" style="margin-left:20px; margin-top:31px">Eugene Token Idle</h1>
    </div>

    <div id="getOutDiv" class="card" style="margin: auto; margin-top: 20px">
        <h2>Welcome to Eugene Token Idle!</h2>
        <p>This is an idle game about scamming others using <em>Eugene Tokens</em>. Please enjoy the game!!!!!!!</p>
        <button class="button1" onclick="getOut()">GET OUT</button>
    </div>

    <div id="mainDiv" class="hide">
        <h2 id="amount" style="text-align: center">You have 0 eugene tokens & 0 money</h2>
        <button class="button1" style="margin-left: 50%;" onmousedown="scam()" onmouseup="scamFinish()">SCAM</button>

        <div style="display:flex; justify-content: center;">
            <div class="card">
                <h3>x1.4 Eugene Token yield</h3>
                <p id="yieldupamount"></p>
                <br>
                <div style="display:flex;">
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(yield, 1)">Buy 1</button> 
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(yield, 5)">Buy 5</button> 
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(yield, 10)">Buy 10</button>
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(yield, 0)">Buy Max</button>
                </div>
            </div>
            <div class="card">
                <h3>x1.4 Eugene Token speed</h3>
                <p id="speedupamount"></p>
                <br>
                <div style="display:flex;">
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(speed, 1)">Buy 1</button> 
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(speed, 5)">Buy 5</button> 
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(speed, 10)">Buy 10</button>
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(speed, 0)">Buy Max</button>
                </div>
            </div>
            <div class="card">
                <h3>x1.4 translation formula</h3>
                <p id="transupamount"></p>
                <br>
                <div style="display:flex;">
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(trans, 1)">Buy 1</button> 
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(trans, 5)">Buy 5</button> 
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(trans, 10)">Buy 10</button>
                    <button class="button1" style="margin-right:10px" onclick="upgradeBuy(trans, 0)">Buy Max</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="text/javascript" src="node_modules/break_eternity.js/dist/break_eternity.js"></script>
    <script type="text/javascript" src="node_modules/eternal_notations/dist/eternal_notations.js"></script>
    <script type="text/javascript" src="utils.js"></script>
    <script type="text/javascript" src="script.js"></script>

</body>
